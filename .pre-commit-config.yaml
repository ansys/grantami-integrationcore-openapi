repos:

- repo: https://github.com/psf/black-pre-commit-mirror
  rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88  # frozen: 26.10.1
  hooks:
  - id: black
    files: '^ansys-grantami-integrationcore-openapi/(src|tests)'
    args:
      - '--line-length=100'

- repo: https://github.com/pycqa/isort
  rev: eb62da318ea543b82340f3d0a52bc0509c7e626e  # frozen: 10.0.0b3
  hooks:
  - id: isort
    files: '^ansys-grantami-integrationcore-openapi/(src|tests)'

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-yaml
  - id: debug-statements
  - id: check-merge-conflict
  - id: trailing-whitespace

- repo: https://github.com/ansys/pre-commit-hooks
  rev: 5e97ca56e2fd5940a745fcba5b1fa6569198267f  # frozen: v0.8.3
  hooks:
    - id: add-license-headers
      args:
      - --start_year=2026
      - --custom_license=Apache-2.0
      files: 'ansys-grantami-integrationcore-openapi/(src|tests)/.*\.(py)'
