name: Dependabot auto-approve
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  automerge-prs:
    name: Automerge PRs (dependabot and pre-commit.ci only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write # Required to allow automerge
      pull-requests: write # Required to allow automerge
    steps:
      - name: Automerge PRs
        uses: ansys/actions/hk-automerge-prs@06390ed64756cfc992121a6d6626a811e352c0e9 # v11.2.1
        with:
          approver: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          approver-token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
