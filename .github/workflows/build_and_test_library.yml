name: 'CI'
# Update the paths once you have created a client library build
on:
  workflow_dispatch:
    inputs:
      publish-to-private-pypi:
        description: Whether to publish the build to the private PyPI
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'
  push:
    tags:
      - "*"
    paths:
      - "ansys-grantami-integrationcore-openapi/**"
      - ".github/workflows/build_and_test_library.yml"
      - "README.md"
  pull_request:
    paths:
      - "ansys-grantami-integrationcore-openapi/**"
      - ".github/workflows/build_and_test_library.yml"
      - "README.md"

permissions: {}

env:
  MAIN_PYTHON_VERSION: '3.13'
  LIBRARY_NAME: 'ansys-grantami-integrationcore-openapi'
  PYANSYS_PYPI_UPLOAD_URL: https://pkgs.dev.azure.com/pyansys/_packaging/pyansys/pypi/upload
  PYANSYS_PYPI_INDEX_URL: https://pkgs.dev.azure.com/pyansys/_packaging/pyansys/pypi/simple/

jobs:
  code-style:
    name: Code Style Check
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the fixes applied by the hooks
      pull-requests: write # Required to comment on issues that cannot be fixed automatically
    env:
      GH_ACTOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
    steps:
      - name: PyAnsys code style checks
        uses: ansys/actions/code-style@5a91d7c2c4da2e86f2b3b62ba62daad189a6b77c # v11.2.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          commit-changes: true
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME || github.actor }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL || env.GH_ACTOR_EMAIL }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN || github.token }}

  tests:
    name: "Test Python ${{ matrix.python-version }} - ${{ matrix.platform }}"
    runs-on: ${{ matrix.platform }}
    needs: [code-style]
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: [ '3.12', '3.13', '3.14' ]
        platform: [ubuntu-latest, windows-latest]
      fail-fast: false
    steps:
      - name: "Enable long paths on Windows"
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true

      - name: "Checkout the project"
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b  # v7.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Test with pytest"
        working-directory: ${{ env.LIBRARY_NAME }}
        run: uv run pytest

      - name: "Run mypy"
        working-directory: ${{ env.LIBRARY_NAME }}
        run: uv run mypy

  build-library:
    name: "Build library"
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: "Checkout the project"
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b  # v7.2.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          enable-cache: 'false'

      - name: "Create source and wheel artifacts"
        working-directory: ${{ env.LIBRARY_NAME }}
        run: |
          uv build

      - name: "Validate integrity of artifacts"
        working-directory: ${{ env.LIBRARY_NAME }}
        run: |
          uv publish --dry-run --no-attestations dist/*

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: ${{ env.LIBRARY_NAME }}/dist/

      - name: "Upload artifacts"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  #v6.0.0
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: ${{ env.LIBRARY_NAME }}/dist/
          retention-days: 7

  release-private-pypi:
    name: "Release to private PyPI"
    runs-on: ubuntu-latest
    needs: [build-library]
    if: (github.event_name == 'push' && contains(github.ref, 'refs/tags')) || ((github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main') && (inputs.publish-to-private-pypi == 'true'))
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b  # v7.2.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          ignore-empty-workdir: "true"
          ignore-nothing-to-cache: "true"

      - name: "Download the library artifacts from build-library step"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: ${{ env.LIBRARY_NAME }}-artifacts

      - name: "Configure authenticated check URL"
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYANSYS_PYPI_PRIVATE_PAT }}
        run: |
          INDEX_HOST="${{ env.PYANSYS_PYPI_INDEX_URL }}"
          INDEX_HOST="${INDEX_HOST#https://}"
          echo "UV_PUBLISH_CHECK_URL=https://__token__:${UV_PUBLISH_TOKEN}@${INDEX_HOST}" >> "$GITHUB_ENV"

      - name: "Check for existing distributions on private PyPI"
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYANSYS_PYPI_PRIVATE_PAT }}
          UV_PUBLISH_URL: ${{ env.PYANSYS_PYPI_UPLOAD_URL }}
        run: uv publish --dry-run --no-attestations ${{ env.LIBRARY_NAME }}-artifacts/*

      - name: "Release to private PyPI"
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYANSYS_PYPI_PRIVATE_PAT }}
          UV_PUBLISH_URL: ${{ env.PYANSYS_PYPI_UPLOAD_URL }}
        run: uv publish --no-attestations ${{ env.LIBRARY_NAME }}-artifacts/*

  release-github:
    name: "Release to GitHub"
    runs-on: ubuntu-latest
    needs: [build-library]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: "Download the library artifacts from build-library step"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: ${{ env.LIBRARY_NAME }}-artifacts

      - name: "Release to GitHub"
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  #v2.5.0
        with:
          files: ${{ env.LIBRARY_NAME }}-artifacts/*.whl
          generate_release_notes: true


  release-pypi:
    name: Release project to PyPI
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [build-library]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: "Download the library artifacts from build-library step"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: ${{ env.LIBRARY_NAME }}-artifacts

      - name: "Upload artifacts to PyPI using trusted publisher"
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ${{ env.LIBRARY_NAME }}-artifacts
          skip-existing: false