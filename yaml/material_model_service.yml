    "/v1/modelDefinitions/{id}": {
      "get": {
        "tags": [
          "ModelDefinitions"
        ],
        "summary": "Get model definition based on id.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            },
            "examples": {
              "B-H curve": {
                "summary": "B-H curve",
                "description": "Example containing a property with multiple candidate attributes",
                "value": "b.h.curve"
              },
              "Chemical resistance": {
                "summary": "Chemical resistance",
                "description": "Example with multiple properties",
                "value": "chemical.resistance"
              },
              "Density with temperature": {
                "summary": "Density with temperature",
                "description": "Example with a property with a free parameter",
                "value": "density.with.temp"
              },
              "Electrical conductivity with temperature": {
                "summary": "Electrical conductivity with temperature",
                "description": "Example with a property with a free parameter",
                "value": "electrical.conductivity.with.temp"
              }
            }
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "text/plain": {
                "schema": {
                  "$ref": "#/components/schemas/MaterialModelDefinition"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MaterialModelDefinition"
                }
              },
              "text/json": {
                "schema": {
                  "$ref": "#/components/schemas/MaterialModelDefinition"
                }
              }
            }
          },
          "default": {
            "description": "Error",
            "content": {
              "text/plain": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "text/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/modelDefinitions": {
      "get": {
        "tags": [
          "ModelDefinitions"
        ],
        "summary": "Get model definitions.",
        "parameters": [
          {
            "name": "resolvableOnly",
            "in": "query",
            "description": "If true, only MMDs that are fully resolvable in at least one database will be returned.\r\nFor a model definition to be considered resolvable it needs to have valid standard name mappings for all properties and parameters in at least one database.",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "format": "int32",
              "default": 1
            }
          },
          {
            "name": "pageSize",
            "in": "query",
            "schema": {
              "type": "integer",
              "format": "int32",
              "default": 100
            }
          },
          {
            "name": "MMS-Package",
            "in": "header",
            "description": "If specified, MMDs that are restricted to this package and MMDs with no package restrictions will be returned.\n\r\nIf not specified, only MMDs with no package restrictions will be returned.\n\r\nSet to 'ALL' to get all MMDs regardless of package restrictions.\n",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "text/plain": {
                "schema": {
                  "$ref": "#/components/schemas/GetModelDefinitionsResponse"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/GetModelDefinitionsResponse"
                }
              },
              "text/json": {
                "schema": {
                  "$ref": "#/components/schemas/GetModelDefinitionsResponse"
                }
              }
            }
          },
          "default": {
            "description": "Error",
            "content": {
              "text/plain": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "text/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/modelDefinitionAttributes": {
      "get": {
        "tags": [
          "ModelDefinitions"
        ],
        "summary": "Get attribute names and GUIDs for MMDs in a given table.",
        "parameters": [
          {
            "name": "tableGuid",
            "in": "query",
            "description": "The table's GUID",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "example": "0000dd92-0011-4fff-8fff-0000ffff0000"
          },
          {
            "name": "databaseKey",
            "in": "query",
            "description": "The database key",
            "schema": {
              "type": "string"
            },
            "example": "MI_Starter_Data"
          },
          {
            "name": "mmdIds",
            "in": "query",
            "description": "A list of MMD IDs to resolve. If not provided, all resolvable MMDs will be included. If an MMD cannot be resolved, it will not be included in the results.",
            "schema": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "examples": {
              "All examples": {
                "summary": "All examples",
                "description": "Include all example MMDs.",
                "value": ["b.h.curve","chemical.resistance","density.with.temp","electrical.conductivity.with.temp"]
              },
              "B-H curve": {
                "summary": "B-H curve",
                "description": "Example containing a property with multiple candidate attributes",
                "value": ["b.h.curve"]
              },
              "Chemical resistance": {
                "summary": "Chemical resistance",
                "description": "Example with multiple properties",
                "value": ["chemical.resistance"]
              },
              "Density with temperature": {
                "summary": "Density with temperature",
                "description": "Example with a property with a free parameter",
                "value": ["density.with.temp"]
              },
              "Electrical conductivity with temperature": {
                "summary": "Electrical conductivity with temperature",
                "description": "Example with a property with a free parameter",
                "value": ["electrical.conductivity.with.temp"]
              }
            }
          },
          {
            "name": "MMS-Package",
            "in": "header",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "text/plain": {
                "schema": {
                  "$ref": "#/components/schemas/MaterialModelDefinitionResolvedAttributesResponse"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MaterialModelDefinitionResolvedAttributesResponse"
                }
              },
              "text/json": {
                "schema": {
                  "$ref": "#/components/schemas/MaterialModelDefinitionResolvedAttributesResponse"
                }
              }
            }
          },
          "default": {
            "description": "Error",
            "content": {
              "text/plain": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "text/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/models/export": {
      "get": {
        "tags": [
          "Models"
        ],
        "summary": "Get material models (without user constraints).",
        "parameters": [
          {
            "name": "recordHistoryGuids",
            "in": "query",
            "description": "The record history GUIDS to export models for.",
            "schema": {
              "type": "array",
              "items": {
                "type": "string",
                "format": "uuid"
              }
            },
            "examples": {
              "Steels": {
                "summary": "Steels",
                "description": "Export all applicable MMDs for some example steels from the MI Starter Data database.",
                "value": ["21e804b8-554f-42a1-836a-940dee451a7e","d9423920-c91e-4b0b-93df-820057bae1bb","acb65b26-ec52-4498-9a3b-d1345a82d133"]
              },
              "Metals with temperature dependent properties": {
                "summary": "Metals with temperature dependent properties",
                "description": "Export all applicable MMDs for some example metals from the MI Starter Data database. These have several attributes with temperature dependent data, including electrical conductivity.",
                "value": ["7402328a-8da6-4a37-a5a8-0e475bdeafe9","316ec25a-a7fd-4ce3-8c25-52fd18140b11"]
              }
            }
          },
          {
            "name": "databaseKey",
            "in": "query",
            "description": "The database to export from.",
            "schema": {
              "type": "string"
            },
            "example": "MI_Starter_Data"
          },
          {
            "name": "mmdIds",
            "in": "query",
            "description": "The MMD IDs to export models for. If empty, all resolvable MMDs will be used.",
            "schema": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "examples": {
              "All examples": {
                "summary": "All examples",
                "description": "Include all example MMDs.",
                "value": ["b.h.curve","chemical.resistance","density.with.temp","electrical.conductivity.with.temp"]
              },
              "B-H curve": {
                "summary": "B-H curve",
                "description": "Example containing a property with multiple candidate attributes",
                "value": ["b.h.curve"]
              },
              "Chemical resistance": {
                "summary": "Chemical resistance",
                "description": "Example with multiple properties",
                "value": ["chemical.resistance"]
              },
              "Density with temperature": {
                "summary": "Density with temperature",
                "description": "Example with a property with a free parameter",
                "value": ["density.with.temp"]
              },
              "Electrical conductivity with temperature": {
                "summary": "Electrical conductivity with temperature",
                "description": "Example with a property with a free parameter",
                "value": ["electrical.conductivity.with.temp"]
              }
            }
          },
          {
            "name": "unitSystem",
            "in": "query",
            "description": "The MI unit system, identified by name.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "useAbsoluteUnits",
            "in": "query",
            "description": "Set to true to use absolute temperature units e.g. Kelvin, otherwise use relative units e.g. Celsius.",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "MMS-Package",
            "in": "header",
            "description": "If specified, MMDs that are restricted to this package, and MMDs with no package restrictions, will be used for the export.\n\r\nIf not specified, only MMDs with no package restrictions will be used for the export.\n\r\nSet to 'ALL' to use all MMDs regardless of package restrictions.\n",
            "schema": {
              "type": "string"
            },
            "example": "ALL"
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "text/plain": {
                "schema": {
                  "$ref": "#/components/schemas/ModelExportResponse"
                },
                "examples": {
                  "Linear elastic isotropic isothermal": {
                    "summary": "Linear elastic isotropic isothermal",
                    "description": "Output of export of 'Linear elastic isotropic isothermal' model for record 'Stainless steel, 316, annealed' in the MI Starter Data database.",
                    "value": {"materials":[{"materialName":"Stainless steel, 316, annealed","materialId":"21e804b8-554f-42a1-836a-940dee451a7e","databaseKey":"MI_Starter_Data","databaseName":"MI Starter Data","tableName":"MaterialUniverse","unitSystem":"SI (Consistent)","absoluteUnits":true,"exportDateTime":"2025-01-15T10:30:00Z","traceabilityNotes":"Material data from Granta MI\r\nRecord name: Stainless steel, 216, annealed\r\nTable name: MaterialUniverse\r\nDate: 2025-01-15 (UTC)","models":[{"modelName":"Linear elastic isotropic isothermal","modelId":"linear-elasticity-isotropic-isothermal","constraints":[{"name":"Temperature","numericValue":21,"unit":"\u00B0C"}],"properties":[{"name":"Linear elastic isotropic isothermal","columns":[{"name":"Young\u0027s modulus","symbol":"E","unit":"GPa","isFreeParameter":false,"numericValues":[195.4]},{"name":"Poisson\u0027s Ratio","symbol":"\u03BD","isFreeParameter":false,"numericValues":[0.2]}]}]}]}],"issues":{}}
                  }
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ModelExportResponse"
                }
              },
              "text/json": {
                "schema": {
                  "$ref": "#/components/schemas/ModelExportResponse"
                }
              }
            }
          },
          "default": {
            "description": "Error",
            "content": {
              "text/plain": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "text/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      },
      "post": {
