              }
            }
          },
          "default": {
            "description": "Error",
            "content": {
              "text/plain": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "text/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/recordSearchCriteria/findRecords": {
      "post": {
        "tags": [
          "RecordSearchCriteria"
        ],
        "summary": "Find records that are applicable to all of the provided MMDs.",
        "description": "Returns record name, record history id, record history guid and the associated database.",
        "parameters": [
          {
            "name": "MMS-Package",
            "in": "header",
            "description": "If specified, record references will be returned for MMDs that are restricted to this package and MMDs with no package restrictions.\n\r\nIf not specified, record references will only be returned for MMDs with no package restrictions.\n\r\nSet to 'ALL' to get record references for all MMDs regardless of package restrictions.\n",
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "description": "The MMD IDs",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RecordSearchRequest"
              }
            },
            "text/json": {
              "schema": {
                "$ref": "#/components/schemas/RecordSearchRequest"
              }
            },
            "application/*+json": {
              "schema": {
                "$ref": "#/components/schemas/RecordSearchRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "text/plain": {
                "schema": {
                  "$ref": "#/components/schemas/RecordSearchResponse"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RecordSearchResponse"
                }
              },
              "text/json": {
                "schema": {
                  "$ref": "#/components/schemas/RecordSearchResponse"
                }
              }
            }
          },
          "default": {
            "description": "Error",
            "content": {
              "text/plain": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "text/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
