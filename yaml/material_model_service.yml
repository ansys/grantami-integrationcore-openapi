    "/v1/recordSearchCriteria": {
      "get": {
        "tags": [
          "RecordSearchCriteria"
        ],
        "summary": "Construct server API search criteria for records that are applicable to all of the provided MMDs.",
        "description": "Returns a dictionary of database key to record search criteria for that database. \n\r\nIf the returned criteria collection is empty, then that means there is no database in which all of the provided Model Definitions are resolvable.",
        "parameters": [
          {
            "name": "mmdIds",
            "in": "query",
            "description": "The MMD IDs",
            "schema": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "examples": {
              "All examples": {
                "summary": "All examples",
                "description": "Include all example MMDs.",
                "value": ["b.h.curve","chemical.resistance","density.with.temp","electrical.conductivity.with.temp"]
              },
              "B-H curve": {
                "summary": "B-H curve",
                "description": "Example containing a property with multiple candidate attributes",
                "value": ["b.h.curve"]
              },
              "Chemical resistance": {
                "summary": "Chemical resistance",
                "description": "Example with multiple properties",
                "value": ["chemical.resistance"]
              },
              "Density with temperature": {
                "summary": "Density with temperature",
                "description": "Example with a property with a free parameter",
                "value": ["density.with.temp"]
              },
              "Electrical conductivity with temperature": {
                "summary": "Electrical conductivity with temperature",
                "description": "Example with a property with a free parameter",
                "value": ["electrical.conductivity.with.temp"]
              }
            }
          },
          {
            "name": "MMS-Package",
            "in": "header",
            "description": "If specified, search criteria will be returned for MMDs that are restricted to this package and MMDs with no package restrictions.\n\r\nIf not specified, search criteria will only be returned for MMDs with no package restrictions.\n\r\nSet to 'ALL' to get search criteria for all MMDs regardless of package restrictions.\n",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "text/plain": {
                "schema": {
                  "$ref": "#/components/schemas/RecordSearchCriteriaResponse"
                },
                "examples": {
                  "Density (simple)": {
                    "summary": "Density (simple)",
                    "description": "A simple example containing only a density property.",
                    "value": {"criteriaByDatabaseKey":{"MI_Starter_Data":{"all":[{"all":[{"any":[{"any":[{"innerCriterion":{"type":"point"},"guid":"f581a241-c2e3-47e1-ba6e-101013070cb3","isMetaAttribute":false,"attributeCriterionType":"exists","type":"attribute"}],"type":"boolean"}],"type":"boolean"}],"type":"boolean"}],"type":"boolean"}}}
                  }
                }
              },
              "application/json": {
